LinesPerFile = 0
WriteHeaderOnRotation = true
# Columns to omit from the CSV writer's output. Tier 1 prune (see
# project_attack_script_reorg audit 2026-05-14): drops 22 columns that
# are either filename-string fields (schema-drift footgun source — caused
# the v2→v3 feature count mismatch when CFE_TBL.LastFileDumped flipped
# text↔numeric mid-corpus), boot-time version constants (provably constant
# per session, ~zero attack relevance, no IF utility on a constant feature),
# or per-session ID constants (SpacecraftID/ProcessorID). Cross-referenced
# against the 14 implementable SPARTA technique footprint declarations —
# no protected fields included.
# ⚠ This list is NOT a cosmetic corpus setting. Training reads the CSV, so a column
# pruned here is excluded from every FUTURE model as well — verified 2026-08-25:
# none of the 23 entries appear in the deployed model's scalar_columns. Prune only
# what can never carry signal, and state which of the two reasons applies:
#   (a) non-numeric  — 7 entries (EVS Message/AppName, the 5 CFE_TBL name fields)
#   (b) static BY CONSTRUCTION — set once in CFE_ES_TaskInit and never recomputed,
#       so it cannot move within a session: CFECoreChecksum and the 12 version fields.
# ⚠ "Looks static in the data" is NOT sufficient on its own — but neither is "the code
# refreshes it". CFE_ES.BootSource was briefly un-pruned on 2026-08-25 (AINOS3-109)
# because CFE_ES_HousekeepingCmd re-reads it every cycle, alongside
# ResetType/ResetSubtype/ProcessorResets which we DO record. That was wrong: the
# nos-linux PSP calls CFE_PSP_MAIN_FUNCTION(reset_type, reset_subtype, 1, ...) with a
# HARDCODED 1 (cfe_psp_start.c:445), so BootSource can only ever be 1 on this
# platform. Re-pruned. The test is whether the VALUE can vary, not whether the code
# touches it each cycle.
# ⚠ This would change on a PSP with real boot banks (e.g. mcp750-vxworks): revisit
# BootSource if NOS3 ever targets one.
# ⚠ (c) NEVER ARRIVES — 9 entries added 2026-09-10 (AINOS3-108, at the AINOS3-124 freeze).
# Measured, not assumed: 100 % `[0]` sentinel across 138,397 frames of the 2026-09-03
# session (training/schema_audit.py). Four subscribed MIDs never transmit, for three
# different reasons — CFE_SB_SUBS 0x080D and SBN 0x08DC are command-produced with zero
# scheduler entries; RADIO_DEV 0x0931 is published opportunistically by the radio proxy
# task and is fully redundant with the identical fields inside RADIO_HK 0x0930, which
# DOES arrive.
# ⚠ ST_DEV 0x0936 is silent too and is deliberately NOT pruned. The star tracker boots
# DISABLED, so this is a configuration question (AINOS3-86 / AINOS3-91), not a dead MID
# — and if AINOS3-86 enables it, those 5 columns must ALREADY be in the frozen schema
# or enabling it forces a re-collect. Silent is not the same as droppable.
# ⚠ These 9 are PRUNED, not UNSUBSCRIBED, and the distinction is load-bearing. The
# deployed IF (iforest_per_mode_v5_invariant_bolstered.pkl) binds features by column
# NAME and has all 9 in its scalar_columns; unsubscribing them crash-looped OnAIR on the
# first frame (894 vs 876 features, 2026-08-25). Pruning touches only the CSV writer, so
# the live frame the IF sees is unchanged while the CORPUS stops carrying dead columns.
# Consequence to know: the deployed IF can no longer be replayed offline against a
# post-freeze CSV without synthesizing the 9 constant columns back. The actual
# unsubscribe (reclaiming 3 slots of the 48-MID pipe cap) is deferred to the next IF
# retrain and is on the schema-vNext list.
ExcludeColumns = CFE_EVS.Message,CFE_EVS.PacketID.AppName,CFE_EVS.PacketID.SpacecraftID,CFE_EVS.PacketID.ProcessorID,CFE_TBL.LastUpdatedTable,CFE_TBL.LastValTableName,CFE_TBL.LastFileLoaded,CFE_TBL.LastFileDumped,CFE_TBL.LastTableLoaded,CFE_ES.CFECoreChecksum,CFE_ES.CFEMajorVersion,CFE_ES.CFEMinorVersion,CFE_ES.CFERevision,CFE_ES.CFEMissionRevision,CFE_ES.OSALMajorVersion,CFE_ES.OSALMinorVersion,CFE_ES.OSALRevision,CFE_ES.OSALMissionRevision,CFE_ES.PSPMajorVersion,CFE_ES.PSPMinorVersion,CFE_ES.PSPRevision,CFE_ES.PSPMissionRevision,CFE_ES.BootSource,CFE_SB_SUBS.PktSegment,CFE_SB_SUBS.TotalSegments,CFE_SB_SUBS.Entries,CFE_SB_SUBS.Entry,SBN.ProtocolIdx,SBN.ModuleStatus,RADIO_DEV.DeviceCounter,RADIO_DEV.DeviceConfig,RADIO_DEV.ProxSignal

