[FILES]
TelemetryFilePath =
TelemetryFile =
MetaFilePath = cf/onair
MetaFile = nos3_security_tlm.json

[DATA_HANDLING]
DataSourceFile = cf/onair/onair/data_handling/sbn_adapter.py

[PLUGINS]
KnowledgeRepPluginDict = {'generic': 'cf/onair/plugins/generic/__init__.py', 'csv_output': 'cf/onair/plugins/csv_output/__init__.py'}
# Re-enabled 2026-05-17: per-ADCS-mode v5 model trained on the 11-baseline
# v5 corpus + bolstered PASSIVE manifest, calibrated at FP=1% per mode.
# See iforest_per_mode_v5_invariant_bolstered.pkl + .calibration.json.
# 2026-05-29: added xgb_classifier downstream of the IF (Phase 3 attack
# classification — see xgb_attack_classifier_v1.pkl). Pipeline shape:
# every frame → IF gating → on anomaly, route to XGBoost for attack-class
# prediction; on nominal, side-file records the skip.
LearnersPluginDict = {'isolation_forest': 'cf/onair/plugins/isolation_forest/__init__.py', 'xgb_classifier': 'cf/onair/plugins/xgb_classifier/__init__.py', 'rule_gate': 'cf/onair/plugins/rule_gate/__init__.py', 'consistency_check': 'cf/onair/plugins/consistency_check/__init__.py', 'staleness_check': 'cf/onair/plugins/staleness_check/__init__.py'}
PlannersPluginDict = {}
ComplexPluginDict = {}

[OPTIONS]
IO_Enabled = false

[ISOLATION_FOREST]
# Per-ADCS-mode IsolationForest pickle (output of train.py --per-scenario
# --label-column __adcs_mode). Each row routes through the IF matching its
# ADCS mode at scoring time via RuntimeRouting below.
# Path resolved relative to OnAIR cwd (fsw/build/exe/cpu1).
ModelPath = ../../../../data/onair/models/iforest_per_mode_v5_invariant_bolstered.pkl
# Per-mode threshold table (output of calibrate.py). Empty ⇒ derive as
# <ModelPath>.calibration.json. If the file is missing or has no entry for
# the active mode, AnomalyThreshold below is used as fallback.
CalibrationPath =
# Fallback model used when RuntimeRouting can't resolve a row's mode (e.g.
# during cold-start before ADCS_GNC.Mode has arrived). MODE_SUNSAFE is the
# best-trained IF (53K rows) and the operationally most-common state.
Scenario = MODE_SUNSAFE
# Fallback threshold (decision_function < threshold ⇒ anomaly). Only used
# when the calibration JSON doesn't supply a value for the active mode.
AnomalyThreshold = 0.0
# Side-file writer: persists per-frame scores to iforest_out_<ts>_pid<N>.csv
# in SideFileOutputDir, joined offline to csv_out_*.csv via
# components/onair/training/loader.py::attach_iforest_scores. Defaults are
# correct for the standard layout — uncomment only to override.
# WriteSideFile = true
# SideFileOutputDir = ../../../../data/onair/csv
# SideFileFlushEvery = 10
# Startup-transient suppression. WarmupFrames matches the trainer's
# --skip-warmup-rows 30 so the first ~30 frames after SBN connection
# (placeholder MIDs + first-arrival deltas) never raise ALERT. Hysteresis
# requires N consecutive frames in the new state before flipping —
# eliminates 1-frame spike noise. Raw score / is_anomaly in the side-file
# are unaffected by these knobs.
# WarmupFrames = 30
# AlertHysteresis = 2
# ClearHysteresis = 2
# Periodic threshold recalibration. OFF by default — opt-in only after
# reviewing the safety semantics. When enabled, the plugin holds a
# rolling window of the last N scores, and every M frames recomputes
# the threshold as the Pth percentile of that window (P = target_fp_rate
# from the calibration JSON). Attempts are SKIPPED if any frame in the
# window had alert_active=True (prevents attack scores from sliding the
# threshold to permit them) OR if the window spans multiple scenarios
# (a routing switch mid-window mixes distributions). Per-attempt shift
# is clamped to MaxDeltaPct of |current threshold| so a bad window
# cannot blow up the threshold. Updates are persisted atomically back
# to the calibration JSON.
# RecalibrationEnabled = false
# RecalibrationWindowFrames = 9000          # ≈ 30 min at 5 Hz
# RecalibrationIntervalFrames = 1500        # ≈ 5 min between attempts
# RecalibrationMaxDeltaPct = 50
# Runtime scenario routing. OFF by default. When RuntimeRouting=true,
# every frame reads RoutingSourceHeader and looks up which per-scenario
# IF to route through via RoutingModeMap (JSON {mode_value:scenario}).
# Hysteresis prevents thrashing across mode boundaries. Unmapped values
# fall back to the static `Scenario` above (graceful degradation).
# RoutingDryRun=true is the safe path: the plugin logs the histogram
# of observed mode values but does NOT switch models — use this to
# build RoutingModeMap from real telemetry, then flip DryRun=false.
#
# v3 (per-scenario IF) pickles need a mission-specific mode→scenario map.
# v4 (per-ADCS-mode IF) pickles use the identity-by-construction map.
# Active config (2026-05-17): apply routing against the per-mode v5 pickle.
RuntimeRouting = true
RoutingDryRun = false
RoutingSourceHeader = ADCS_GNC.Mode
RoutingModeMap = {"0":"MODE_PASSIVE","1":"MODE_BDOT","2":"MODE_SUNSAFE","3":"MODE_INERTIAL"}
# RoutingHysteresisFrames ≈ 6 s at 5 Hz
RoutingHysteresisFrames = 30
# RoutingDryRunReportEvery: histogram log cadence
RoutingDryRunReportEvery = 1000
# Mode-switch warmup. After every routing-driven scenario switch, the
# plugin re-arms an N-frame warmup window during which ALERT and CLEAR
# transitions are suppressed. Raw score / is_anomaly continue to land in
# the side-file. The switch also clears prev_raw + the consec_anomaly /
# consec_nominal streak counters so the first new-mode frame sees zero
# deltas and stale streaks don't bias the post-switch threshold crossing.
# NOS3-303: reduced 600→250 (~52 s @ 4.83 fps). A 36-switch nominal soak
# (analyze_mode_switch_warmup.py) showed the mode-entry transient settles by
# ~frame 175 (~36 s); 250 clears it with margin and cuts the per-switch
# detection blind window ~58 % (124 s → 52 s) at ~0 FP cost.
# Set to 0 to disable the feature and restore pre-existing routing byte-for-byte.
ModeSwitchWarmupFrames = 250

[XGB_CLASSIFIER]
# Phase 3 attack classifier (sklearn HistGradientBoosting, XGBoost-shape).
# v1 trained on the 2026-05-16 corpus only (single instance). Temporal
# accuracy 67.6% but cross-instance baseline was 53.5% — overfit.
# v2 trained on combined 2026-05-16 + 2026-05-29 batch-1 (2 instances).
# Temporal accuracy 62.8% but still showed gap vs cross-instance.
# v3 trained on 3 instances (2026-05-16 + batch-1 + batch-2, 75
# manifests). Temporal accuracy 65.6%, leave-one-instance-out (LOIO)
# accuracy 64.5% ± 3.6% — temporal ≈ LOIO confirms NO OVERFIT.
# Operational class taxonomy in the calibration JSON: 4 ROBUST classes
# (F1 ≥ 0.85), 4 STABLE MID, 5 HIGH-VARIANCE, 6 DEAD. v3 is the
# defensible deployed model. See matching calibration JSON.
ClassifierPath = ../../../../data/onair/models/xgb_attack_classifier_v3.pkl
# Empty ⇒ derive as <model>.calibration.json
CalibrationPath =
# Gating IF + thresholds — must match the per-mode v5 model the upstream
# isolation_forest plugin uses. The classifier plugin re-scores each
# frame through this IF independently so it doesn't rely on cross-plugin
# data flow via OnAIR's high_level_data path.
IfModelPath = ../../../../data/onair/models/iforest_per_mode_v5_invariant_bolstered.pkl
IfCalibrationPath =
# Mode routing mirrors the IF plugin's RoutingModeMap so both stay in
# lock-step. ADCS_GNC.Mode → per-mode IF for gating; classifier runs
# downstream on the anomalous rows only.
RoutingSourceHeader = ADCS_GNC.Mode
RoutingModeMap = {"0":"MODE_PASSIVE","1":"MODE_BDOT","2":"MODE_SUNSAFE","3":"MODE_INERTIAL"}
FallbackMode = MODE_SUNSAFE
# Top-K predictions surfaced in side-file (operators see ties for the
# known telemetry-indistinguishable pairs like EX-0012.03 ≡ .04).
# TopK = 3
# MinConfidence = 0.30                  # below this max-prob ⇒ "unknown"
# WarmupFrames = 30                     # skip classification during SBN warm-up
# SideFileOutputDir = ../../../../data/onair/csv
# SideFileFlushEvery = 10
# WriteSideFile = true
# ─── NOS3-202: cluster reporting ─────────────────────────────────────
# Collapse telemetry-indistinguishable sub-techniques (EX-0012.03/04/05,
# EX-0012.12 ≡ EX-0014.01) into a single reported cluster. Empty ⇒ derive
# as <classifier_dir>/cluster_rescore/cluster_taxonomy.json (== path below).
# Missing file ⇒ raw sub-techniques (no behaviour change).
ClusterTaxonomyPath = ../../../../data/onair/models/cluster_rescore/cluster_taxonomy.json
# ─── NOS3-201: incident-level alerting ───────────────────────────────
# Collapse a hysteresis-confirmed run of anomalous frames into one incident
# (start, duration, cluster, accumulated confidence) → incident_<ts>_pid<N>.csv.
# Hysteresis mirrors the isolation_forest plugin so an incident == one alert.
WriteIncidentFile = true
AlertHysteresis = 3
ClearHysteresis = 5
# IncidentMinAnomalyFrames = 1

[CSV_OUTPUT]
# Output dir is resolved relative to OnAIR's cwd (fsw/build/exe/cpu1).
# `../../../../data/onair/csv` resolves to repo_root/data/onair/csv — outside
# the build tree, so CSVs survive a `rm -rf fsw/build` clean rebuild.
OutputDir = ../../../../data/onair/csv
# Filename tokens: {timestamp} = ISO 8601 + microseconds, : -> - ; {pid} = process id
FilenameTemplate = csv_out_{timestamp}_pid{pid}
# LinesPerFile = 0 → session-scoped: one CSV per OnAIR plugin lifetime
# (recommended). Record-count rotation produces unmanageable file counts and
# arbitrary boundaries that don't align with operational events.
LinesPerFile = 0
WriteHeaderOnRotation = true
# Columns to omit from the CSV writer's output. Tier 1 prune (see
# project_attack_script_reorg audit 2026-05-14): drops 22 columns that
# are either filename-string fields (schema-drift footgun source — caused
# the v2→v3 feature count mismatch when CFE_TBL.LastFileDumped flipped
# text↔numeric mid-corpus), boot-time version constants (provably constant
# per session, ~zero attack relevance, no IF utility on a constant feature),
# or per-session ID constants (SpacecraftID/ProcessorID). Cross-referenced
# against the 14 implementable SPARTA technique footprint declarations —
# no protected fields included.
ExcludeColumns = CFE_EVS.Message,CFE_EVS.PacketID.AppName,CFE_EVS.PacketID.SpacecraftID,CFE_EVS.PacketID.ProcessorID,CFE_TBL.LastUpdatedTable,CFE_TBL.LastValTableName,CFE_TBL.LastFileLoaded,CFE_TBL.LastFileDumped,CFE_TBL.LastTableLoaded,CFE_ES.CFECoreChecksum,CFE_ES.CFEMajorVersion,CFE_ES.CFEMinorVersion,CFE_ES.CFERevision,CFE_ES.CFEMissionRevision,CFE_ES.OSALMajorVersion,CFE_ES.OSALMinorVersion,CFE_ES.OSALRevision,CFE_ES.OSALMissionRevision,CFE_ES.PSPMajorVersion,CFE_ES.PSPMinorVersion,CFE_ES.PSPRevision,CFE_ES.PSPMissionRevision,CFE_ES.BootSource
