[SBN_ADAPTER]
# Read ONLY by sbn_adapter_blended.py — inert while DataSourceFile above
# points at the stock sbn_adapter.
#
# ⚠ This parser does NOT strip inline '#'. Comments get their own line.
#
# BlendMode:
#   tap     get_next() returns the RAW frame (parent behaviour, untouched), and
#           the blended stream is side-written to csv_blended_*.csv. Both files
#           exist, one row each per frame, so verify_blend_equivalence.py can
#           prove deinterleave_csv.py(raw) == the native blend. Detectors are
#           unaffected. This is the AC2/AC2b verification mode.
#   inline  get_next() returns the BLENDED frame, so csv_output records it and
#           the raw interleaved stream is NOT saved at all. The end state — but
#           ⚠ gated on AC4: the IF and classifier must be refitted on blended
#           data first, and [CSV_OUTPUT] OutputDir must be repointed at
#           csv_blended/ (the DIRECTORY is what marks data as blended; the
#           basename stays csv_out_*). Repoint each plugin's
#           SideFileOutputDir the same way, so csv_blended/iforest_out_*
#           means "decisions on blended frames" and csv/iforest_out_* keeps
#           meaning "decisions on interleaved frames".
#   off     no blending, no side file; byte-for-byte the stock adapter.
BlendMode = tap
BlendedFilenameTemplate = csv_out_{timestamp}_pid{pid}
# Blank -> a SIBLING csv_blended/ of [CSV_OUTPUT] OutputDir, NOT that dir
# itself. data/csv already mixes 11 recording generations with every
# plugin side-file, and AINOS3-125 AC4 put the offline-blended corpus in
# data/csv_blended/ — native output belongs in the same place.
BlendedOutputDir =
# ProfileEvery = N frames -> log blend/write cost percentiles and the share of
# a frame the transform consumes. 0 = off. The bench (training/bench_blend.py)
# measured 0.21 % of a 5 Hz frame; this confirms it in situ.
ProfileEvery = 300
# Rows between flushes. 1 matches csv_output's per-row durability.
FlushEvery = 1
# FrameIntervalMs: cap the recorder's frame (row) rate to a fixed cadence.
# The row rate otherwise rides the aggregate SBN arrival rate, so a MID that
# publishes slower than that rate repeats across rows. With every dynamic MID
# published ABOVE this cadence (10 Hz SCH table), each emitted row lands on
# fresh data. 0 = no cap (arrival-driven); 200 = a steady 5 Hz.
FrameIntervalMs = 200
# ArrivalReportEvery = N seconds -> count how often each subscribed packet
# ACTUALLY arrives over SBN (rate, p50/max inter-arrival gap, time since the
# last one) and append one JSON line per window to arrivals_<ts>_pid<N>.jsonl.
# The CSV cannot show this: a static counter's column never changes whatever
# its packet cadence. Log-only — the recorded schema is untouched. 0 = off.
ArrivalReportEvery = 10
# Blank -> a SIBLING arrivals/ of [CSV_OUTPUT] OutputDir.
ArrivalOutputDir =
# Stamp every frame with its arrival time as OnAIR.FrameRecvUTC (ISO-8601 UTC),
# in the same form an attack manifest's start_utc uses, so labelling compares
# timestamps directly instead of reconstructing them.
# ⚠ Until this column existed, loader._synthesize_row_times rebuilt row times
# as file_start + row_idx/rate with the rate inferred from the gap to the NEXT
# FILE — a gap that includes the ~2 min stack restart between runs. Measured
# across the 113 rebuild_2026-09-10 runs: median 57 s of drift by end-of-file,
# worst 188 s, against attack windows of a few minutes.
# ⚠ Adding it MOVES recorded_schema_sha256 (the AINOS3-124 freeze). It does NOT
# move schema_sha256 — the tlm json is untouched, because a column the stock
# sbn_adapter cannot produce must not live there.
FrameTimestamp = true
# Stamp every frame with SIMULATION time as OnAIR.SimTimeUTC, decoded from the
# NOVATEL GPS week/second pair with the 10-bit week rollover resolved against
# cfg/InOut/Inp_Sim.txt (default epoch 2025-10-20 17:43:20 UTC).
# ⚠ Not already available: CFE_TIME.SecondsSTCF is 0 (MET only), and a naive
# GPS decode of week 341 yields 1986-07-21 — the time of day is right either
# way, which is what makes that bug survivable.
# Monotonic by construction: torn NOVATEL reads are rejected (measured 10 per
# 2,610 frames) and the last good value carried forward.
# ⚠ Every run to date launches from the SAME epoch, so the corpus samples one
# orbital phase and has no eclipse/sunlit variation. This column is what makes
# a changed epoch legible.
SimTime = true

